<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- MesloLGS NF ships monochrome glyphs for many emoji codepoints, which
     stops per-glyph fallback before reaching Noto Color Emoji. Strip the
     emoji ranges from its charset so terminals fall through to the color
     font. Nerd Font icons (private use area) are untouched. -->
<fontconfig>
  <match target="scan">
    <test name="family" compare="contains">
      <string>MesloLGS NF</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x2190</int><int>0x21FF</int></range> <!-- arrows (🔀-like legacy) -->
          <range><int>0x2300</int><int>0x23FF</int></range> <!-- misc technical: ⏳ ⏰ -->
          <range><int>0x2600</int><int>0x27BF</int></range> <!-- misc symbols, dingbats: ✅ ❌ -->
          <range><int>0x2B00</int><int>0x2BFF</int></range> <!-- misc symbols and arrows -->
          <range><int>0x1F000</int><int>0x1FAFF</int></range> <!-- emoji blocks: 🔀 👀 💬 🛑 … -->
        </charset>
      </minus>
    </edit>
  </match>

  <!-- Make Noto Color Emoji the first fallback after MesloLGS NF, ahead of
       other symbol fonts (Font Awesome etc.) that also cover emoji ranges. -->
  <match target="pattern">
    <test name="family" compare="contains">
      <string>MesloLGS NF</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
