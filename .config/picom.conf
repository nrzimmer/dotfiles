# picom config — purpose: eliminate screen/video tearing on i3 (no compositor by default).
# Minimal/clean: VSync on, no eye-candy. NVIDIA-friendly glx backend.

backend = "glx";          # GPU-accelerated; best path on NVIDIA
vsync = true;             # the actual tear fix — sync presentation to vblank

# Let fullscreen apps (games, fullscreen video) bypass the compositor so they
# run with zero added latency. This is why gaming is unaffected.
unredir-if-possible = true;

# Keep it lean — no cosmetic effects.
shadow = false;
fading = false;
corner-radius = 0;

# Don't manage these (avoids flicker/artifacts on docks, desktop bg, etc.).
wintypes:
{
  dock = { shadow = false; };
  tooltip = { shadow = false; focus = true; };
  popup_menu = { shadow = false; };
  dropdown_menu = { shadow = false; };
};
