# set-wm-icon config
# One rule per line:  <WM_CLASS regex> = <path to PNG>
# The regex is matched (case-insensitive, re.search) against BOTH strings of
# the window's WM_CLASS (instance and class). First match wins.
# Lines starting with # and blank lines are ignored.

^slack$                = /usr/share/pixmaps/slack.png
^org\.squidowl\.halloy$ = /home/zimmer/.local/share/icons/hicolor/512x512/apps/org.squidowl.halloy.png
